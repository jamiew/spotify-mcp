name: CI

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v6

    - name: Install uv
      uses: astral-sh/setup-uv@v8.1.0
      with:
        version: "0.13.7"
        enable-cache: true

    - name: Set up project
      run: uv sync --locked

    - name: Run ruff linter
      run: uv run ruff check src/ tests/

    - name: Run ruff formatter check
      run: uv run ruff format --check src/ tests/

  test:
    runs-on: ubuntu-latest
    needs: [lint]  # Don't test broken code
    strategy:
      matrix:
        python-version: ["3.12", "3.13", "3.14"]

    steps:
    - uses: actions/checkout@v6

    # setup-uv's python-version sets UV_PYTHON, which overrides .python-version.
    # A separate setup-python step would not: uv would still pick 3.12.
    - name: Install uv and Python ${{ matrix.python-version }}
      uses: astral-sh/setup-uv@v8.1.0
      with:
        version: "0.13.7"
        python-version: ${{ matrix.python-version }}
        enable-cache: true

    - name: Set up project
      run: uv sync --locked

    - name: Run type checking
      run: uv run mypy src/

    - name: Run tests
      run: uv run pytest

  security:
    runs-on: ubuntu-latest
    needs: [lint]  # Don't scan broken code
    steps:
    - uses: actions/checkout@v6

    - name: Install uv
      uses: astral-sh/setup-uv@v8.1.0
      with:
        version: "0.13.7"
        enable-cache: true

    - name: Set up project
      run: uv sync --locked

    - name: Run bandit security linter
      run: uv run bandit -r src/

  build:
    runs-on: ubuntu-latest
    needs: [test, lint, security]  # Require all quality gates
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'

    steps:
    - uses: actions/checkout@v6

    - name: Install uv
      uses: astral-sh/setup-uv@v8.1.0
      with:
        version: "0.13.7"
        enable-cache: true

    - name: Build package
      run: uv build

    - name: Store build artifacts
      uses: actions/upload-artifact@v7
      with:
        name: dist
        path: dist/

  docker:
    runs-on: ubuntu-latest
    needs: [test, lint, security]
    steps:
    - uses: actions/checkout@v6

    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v4

    - name: Build Docker image
      uses: docker/build-push-action@v7
      with:
        context: .
        file: ./Dockerfile
        push: false
        load: true  # Load image into Docker daemon for testing
        tags: spotify-mcp:test
        cache-from: type=gha
        cache-to: type=gha,mode=max

    - name: Test Docker image
      run: |
        # Test that the entry point is installed and accessible
        docker run --rm spotify-mcp:test which spotify-mcp

        # Test that the server module imports with its installed dependencies
        docker run --rm -e SPOTIFY_CLIENT_ID=test -e SPOTIFY_CLIENT_SECRET=test -e SPOTIFY_REDIRECT_URI=http://localhost:8888 spotify-mcp:test python -c "import spotify_mcp.fastmcp_server"

        # Test security: ensure running as non-root user
        docker run --rm spotify-mcp:test sh -c 'whoami | grep -v root'
