name: Publish to PyPI & MCP Registry

on:
  release:
    types: [published]
  workflow_dispatch:

permissions:
  id-token: write
  contents: read

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Install uv
        uses: astral-sh/setup-uv@v8.1.0

      - name: Set up Python
        run: uv python install 3.12

      - name: Install dependencies
        run: uv sync --all-groups

      - name: Run type checking
        run: uv run mypy src/

      - name: Run tests
        run: uv run pytest

      # server.json is kept in sync with pyproject by tests/test_packaging.py, so the
      # tag only needs to match pyproject.
      - name: Check release tag matches package version
        if: github.event_name == 'release'
        run: test "$GITHUB_REF_NAME" = "v$(uv version --short)"

      - name: Build package
        run: uv build

      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          # Lets a manual rerun retry the registry step after PyPI succeeded.
          skip-existing: true

      - name: Install mcp-publisher
        run: |
          curl -L "https://github.com/modelcontextprotocol/registry/releases/latest/download/mcp-publisher_linux_amd64.tar.gz" | tar xz mcp-publisher

      - name: Authenticate to MCP Registry
        run: ./mcp-publisher login github-oidc

      - name: Publish to MCP Registry
        run: ./mcp-publisher publish
