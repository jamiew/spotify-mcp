name: Publish to PyPI & MCP Registry

on:
  release:
    types: [published]
  workflow_dispatch:

permissions:
  id-token: write
  contents: read

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Install uv
        uses: astral-sh/setup-uv@v8.1.0
        with:
          version: "0.13.7"

      - name: Install dependencies
        run: uv sync --locked --all-groups

      - name: Run type checking
        run: uv run mypy src/

      - name: Run tests
        run: uv run pytest

      # server.json is kept in sync with pyproject by tests/test_packaging.py, so the
      # tag only needs to match pyproject.
      - name: Check release tag matches package version
        if: github.event_name == 'release'
        run: test "$GITHUB_REF_NAME" = "v$(uv version --short)"

      - name: Build package
        run: uv build

      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          # Lets a manual rerun retry the registry step after PyPI succeeded.
          skip-existing: true

      # Pinned release; the SHA-256 comes from that release's registry_<ver>_checksums.txt.
      - name: Install mcp-publisher
        env:
          MCP_PUBLISHER_VERSION: v1.8.8
          MCP_PUBLISHER_SHA256: 09f1fa70ee146b640584274a1a6b2b8a0310b05d4321fa9224e6df6a016d67f4
        run: |
          curl -fsSL -o mcp-publisher.tar.gz "https://github.com/modelcontextprotocol/registry/releases/download/${MCP_PUBLISHER_VERSION}/mcp-publisher_linux_amd64.tar.gz"
          echo "${MCP_PUBLISHER_SHA256}  mcp-publisher.tar.gz" | sha256sum -c -
          tar xzf mcp-publisher.tar.gz mcp-publisher

      - name: Authenticate to MCP Registry
        run: ./mcp-publisher login github-oidc

      - name: Publish to MCP Registry
        run: ./mcp-publisher publish
